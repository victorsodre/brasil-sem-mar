<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasil sem mar — varredura e pontos</title>
<meta name="description" content="O relevo real de um lugar do Brasil, acima e abaixo do mar, em pontos de luz: a água esvazia e o fundo aparece.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.min.js",
    "three/addons/": "../../vendor/three/addons/"
  }
}
</script>
<!-- Preload só depois do importmap: antes dele, "three" não resolve. -->
<link rel="modulepreload" href="../../vendor/three/three.module.min.js">
<link rel="modulepreload" href="../../vendor/three/three.core.min.js">
</head>
<body>
<canvas id="cena"></canvas>
<div id="ui" hidden>
  <header id="topo">
    <h1 id="nome">…</h1>
    <p id="exagero"></p>
  </header>
  <div id="controles">
    <button id="reproduzir" type="button">Reproduzir</button>
    <label class="faixa">
      <span>Tempo <output id="tempo-valor">0 s</output></span>
      <input id="tempo" type="range" min="0" max="61" step="0.1" value="0">
    </label>
    <label class="faixa">
      <span>Esvaziar <output id="agua-valor">0 m</output></span>
      <input id="agua" type="range" min="-5500" max="0" step="10" value="0">
    </label>
  </div>
  <footer id="creditos"></footer>
</div>
<div id="erro" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
