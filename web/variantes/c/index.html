<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasil sem mar — variante C</title>
<meta name="description" content="O relevo real de um lugar do Brasil, acima e abaixo do mar, em 3D: a água esvazia e as montanhas submarinas aparecem. Variante C: superfície escura com arestas neon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 26 L11 10 L17 20 L22 14 L30 26 Z' fill='none' stroke='%2339e6ff' stroke-width='2'/></svg>">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.min.js",
    "three/addons/": "../../vendor/three/addons/",
    "../../vendor/three/addons/utils/SkeletonUtils.js": "./shim-skeleton-utils.js"
  }
}
</script>
<link rel="modulepreload" href="../../vendor/three/three.module.min.js">
<link rel="modulepreload" href="../../vendor/three/three.core.min.js">
</head>
<body>
<canvas id="cena" aria-label="relevo em 3D"></canvas>
<div id="ui" class="ui" hidden>
  <header class="topo">
    <h1 id="nome">…</h1>
    <p id="sub">relevo acima e abaixo do mar</p>
  </header>
  <div class="barra" role="group" aria-label="controles">
    <button id="reproduzir" type="button">Reproduzir</button>
    <label class="campo"><span>Tempo</span><input id="tempo" type="range" min="0" max="61" step="0.033" value="0"><output id="tempo-val">0 s</output></label>
    <label class="campo"><span>Esvaziar</span><input id="agua" type="range" min="-5500" max="0" step="1" value="0"><output id="agua-val">0 m</output></label>
  </div>
  <p class="dica" id="dica">arraste para orbitar · roda do mouse para aproximar</p>
  <footer class="creditos" id="creditos"></footer>
</div>
<div id="aviso" class="aviso" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
