<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasil sem mar — contorno topográfico</title>
<meta name="description" content="O relevo real de um lugar do Brasil, acima e abaixo do mar, em linhas de contorno neon. Variante A.">

<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.min.js",

<link rel="modulepreload" href="../../vendor/three/three.module.min.js">

<body>
<canvas id="cena" aria-label="Relevo em três dimensões"></canvas>

<header class="ui topo">
  <h1 id="nome">Carregando o relevo…</h1>
  <p id="exagero"></p>
</header>

<div class="ui controles" id="controles" hidden>
  <button id="reproduzir" type="button">Reproduzir</button>
  <label>Esvaziar <input id="esvaziar" type="range" min="0" max="1000" value="0" step="1"></label>
  <label>Tempo <input id="tempo" type="range" min="0" max="61000" value="0" step="1"></label>
  <output id="relogio">0,0 s</output>
  <span class="dica">Arraste para orbitar</span>
</div>

<footer class="ui creditos" id="creditos" hidden></footer>

<p class="ui erro" id="erro" hidden></p>

<script type="module" src="./app.js"></script>
</body>
</html>
